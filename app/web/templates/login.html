<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - TG Group Guard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .login-box { max-width: 400px; margin: 10% auto; }
        .card { border: none; box-shadow: 0 0 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <div class="card">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">🛡️ TG Group Guard</h3>
                <p class="text-muted text-center mb-4">管理后台登录</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">管理密码</label>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
