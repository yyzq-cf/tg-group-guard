<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二步验证 - TG Group Guard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        [data-bs-theme="light"] { --body-bg: #f8f9fa; --card-bg: #fff; }
        [data-bs-theme="dark"] { --body-bg: #1a1d21; --card-bg: #212529; }
        body { background: var(--body-bg); }
        .login-box { max-width: 400px; margin: 10% auto; }
        .card { border: none; box-shadow: 0 0 20px rgba(0,0,0,0.08); background: var(--card-bg); }
        .code-input { font-size: 1.5rem; letter-spacing: 0.5rem; text-align: center; }
        .theme-toggle { cursor: pointer; font-size: 1.3rem; transition: transform 0.3s; }
        .theme-toggle:hover { transform: rotate(30deg); }
    </style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <div class="card">
            <div class="card-body p-5">
                <h3 class="text-center mb-2">🔐 二步验证</h3>
                <p class="text-muted text-center mb-4">请输入验证器中的 6 位验证码</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">验证码</label>
                        <input type="text" name="code" class="form-control code-input"
                               placeholder="000000" maxlength="6" pattern="[0-9]{6}"
                               inputmode="numeric" autocomplete="one-time-code" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">验证</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{{ url_for('logout') }}" class="text-muted">返回登录</a>
                </div>
            </div>
            <div class="text-center pb-3">
                <a href="#" class="text-muted text-decoration-none" onclick="toggleTheme(); return false;">
                    <span class="theme-toggle">🌙</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
function getTheme() { return localStorage.getItem('theme') || 'light'; }
function applyTheme(theme) {
    document.documentElement.setAttribute('data-bs-theme', theme);
    localStorage.setItem('theme', theme);
    var el = document.querySelector('.theme-toggle');
    if (el) el.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
applyTheme(getTheme());
</script>
</body>
</html>
